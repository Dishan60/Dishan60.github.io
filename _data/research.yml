projects:
  - type: Undergraduate Thesis
    year: "2021"
    title: "An Alternative Proposal for Jetty and Pontoon Design in Paturia Ferry Ghat"
    description: "Designed a permanent ghat-area layout able to cope with seasonal water-level change. By analysing a decade of hydro-morphological data, three subdivision lanes were planned and a specialised pontoon was designed for ferries, passenger vessels and engine boats."
    tools:
      - AutoCAD
      - SolidWorks
      - Hydro-morphological analysis
    supervisor: "Dr. S M Ikhtiar Mahmud, MIST"
  - type: Design Project
    year: "2020"
    title: "180 TEU Cargo Container Ship — Dhaka to Payra Port"
    description: "Year-long design of a 180 TEU container vessel: GA plan, lines plan, deck plans, weight, stability and resistance calculations, and engine foundation design, producing a comprehensive plan for the vessel."
    tools:
      - AutoCAD
      - Rhinoceros
      - Maxsurf
    supervisor: "Dr. S M Ikhtiar Mahmud, MIST"
